name: Deploy Backend to Elastic Beanstalk

on:
  push:
    branches:
      - deploy-prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Generate deployment package
        run: zip -r deploy.zip . -x "*.git*" "node_modules/*"

      - name: Create Elastic Beanstalk application version
        run: |
          aws s3 cp deploy.zip s3://${{ secrets.EB_S3_BUCKET }}/backend-${{ github.sha }}.zip
          aws elasticbeanstalk create-application-version \
            --application-name "${{ secrets.EB_APPLICATION_NAME }}" \
            --version-label "backend-${{ github.sha }}" \
            --source-bundle S3Bucket="${{ secrets.EB_S3_BUCKET }}",S3Key="backend-${{ github.sha }}.zip"

      - name: Deploy application version to environment
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "${{ secrets.EB_ENVIRONMENT_NAME }}" \
            --version-label "backend-${{ github.sha }}"

      - name: Wait for environment update
        run: |
          aws elasticbeanstalk wait environment-updated \
            --environment-names "${{ secrets.EB_ENVIRONMENT_NAME }}"